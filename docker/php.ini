; One upload can be up to 5 MB, and an application can include several documents.
upload_max_filesize = 6M
post_max_size = 50M
memory_limit = 256M
expose_php = Off

; Code only changes with a new image, so never re-check files.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
