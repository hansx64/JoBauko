# The port is rewritten at start-up to $PORT (docker/start.sh).
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve dotfiles such as .env
    <LocationMatch "/\.(?!well-known)">
        Require all denied
    </LocationMatch>

    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

ServerTokens Prod
# Silences AH00558; links are built from APP_URL, not from this name.
ServerName localhost
